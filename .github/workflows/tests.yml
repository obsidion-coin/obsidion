# Runs the full suite on every push and pull request.
#
# For a currency this is not decoration. Anyone deciding whether to trust the
# software can see, on the repository front page, that consensus rules — the
# supply cap, reorg handling, signature validation — are verified on every
# commit and on a machine that is not the author's.

name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ecdsa flask pytest

      - name: Run the test suite
        run: python -m pytest -q

      - name: Verify the genesis block is what params.py claims
        run: |
          python -c "
          from obsidion.genesis import genesis_hash
          from obsidion.params import MAINNET
          expected = '69e33674de2c169233dbbdca69dcd1ede122207cd7ead83c5564e08172862a7a'
          actual = genesis_hash(MAINNET)[::-1].hex()
          assert actual == expected, f'genesis changed: {actual}'
          print('mainnet genesis verified:', actual)
          "
